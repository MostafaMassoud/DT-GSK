# NOTE (2026-07-28, decision_log D-0025): decc-g listed below now RAISES on
# every dimension in this config. DECC-G's random grouping needs
# dim > group_size (default 100) to form more than one subcomponent; at or
# below it the regrouping is a no-op and the run is SaNSDE with adaptive
# weighting wearing the DECC-G label. The guard is deliberate -- pass an
# explicit optimizer_options.group_size if a decomposed run at these
# dimensions is genuinely intended. DECC-G is meaningful here only on
# CEC2013LSGO (D=905/1000 -> 10 subcomponents).
# NOTE (2026-07-28, decision_log D-0025): mos-cec2013lsgo's MTS-LS1 bounds bug
# is fixed (it clipped against dim-0 scalars, so 12 of these 22 problems
# evaluated outside the feasible box). Results here are now feasible, but MOS
# is a CEC2013LSGO specialist whose parity verification covers only that
# suite's per-variable-uniform boxes, and its scalar SR step ladder is still
# seeded from dim 0's range. Treat any CEC2011 MOS row as unvalidated.
# External SOTA baselines on CEC2011
#
# NOT part of the seven-method GSK-family panel: these are external comparators run
# under the identical protocol so comparisons are first-party rather than quoted from
# published tables. See src/gsk_family/optimizers/external/.
#
# Usage:
#   python run.py --config configs/baselines_cec2011.yml --workers 14
#
# Resume is automatic and safe: re-running the same line skips every completed
# (function, run, seed) cell. Do NOT add `overwrite: true` unless you intend to
# discard existing runs -- it is scoped per optimizer, so it would clear exactly
# the optimizers listed below.
#
# Protocol is identical across family and baselines so the cells are directly
# comparable and fold into one cross-optimizer analysis: same seed schedule,
# same generator, same budget, same output tree.

optimizers:
  - cmaes
  - lshade
  - jso
  - lshade-spacma
  - ebowithcmar
  - shade-ils
  - mos-cec2013lsgo
  - decc-g

suite: cec2011
functions: all          # 22 real-world problems at their native dimensions
dimensions: native
runs: 25                # CEC2011 convention (Das & Suganthan 2010 problem definitions)

seed: 20240620
seed_policy: unified
rand_generator: threefry
max_evaluations: 0          # 0 = the suite's own protocol budget

overwrite: false
parallel: true
parallel_backend: process
numba_threads: 1
generation_logs: true
convergence_graphs: false
benchmark_fp_mode: default
benchmark_backend: auto
data_root: benchmarks/cec_suite_python
reference_root: benchmarks/cec_reference_results
output_root: results/_run_all
