# External SOTA baselines on CEC2013LSGO
#
# NOT part of the seven-method GSK-family panel: these are external comparators run
# under the identical protocol so comparisons are first-party rather than quoted from
# published tables. See src/gsk_family/optimizers/external/.
#
# Usage:
#   python run.py --config configs/baselines_cec2013lsgo.yml --workers 14
#
# Resume is automatic and safe: re-running the same line skips every completed
# (function, run, seed) cell. Do NOT add `overwrite: true` unless you intend to
# discard existing runs -- it is scoped per optimizer, so it would clear exactly
# the optimizers listed below.
#
# Protocol is identical across family and baselines so the cells are directly
# comparable and fold into one cross-optimizer analysis: same seed schedule,
# same generator, same budget, same output tree.

optimizers:
  - shade-ils
  - mos-cec2013lsgo
  - decc-g
  - cmaes
  - lshade
  - jso
  - lshade-spacma
  - ebowithcmar

suite: cec2013lsgo
functions: all          # 15 functions; F13/F14 are 905-dimensional, the rest 1000
dimensions: native
runs: 25                # CEC2013-LSGO convention (Li et al. 2013 benchmark functions)

seed: 20240620
seed_policy: unified
rand_generator: threefry
max_evaluations: 0          # 0 = the suite's own protocol budget

overwrite: false
parallel: true
parallel_backend: process
numba_threads: 1
generation_logs: true
convergence_graphs: false
benchmark_fp_mode: default
benchmark_backend: auto
data_root: benchmarks/cec_suite_python
reference_root: benchmarks/cec_reference_results
output_root: results/_run_all

# COST NOTE (D = 1000). CMA-ES pays O(D^2)-O(D^3) covariance updates and
# eigendecompositions and is by far the slowest here; the DE-family baselines
# initialise 18k-20k individuals, which the 3e6 budget accommodates. Measure one
# function before committing to the full grid. shade-ils, mos-cec2013lsgo and
# decc-g already have complete 375/375 banks -- `overwrite: false` preserves them.
