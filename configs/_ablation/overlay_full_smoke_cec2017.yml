# SMOKE gauge for the ISM(SGSM)-overlay isolation (Phase A2). Same 'full' cell
# as overlay_full_cec2017.yml but only 2 runs on D50 and D100, so the per-cell /
# per-dimension wall-time can be measured before committing to the full 4-cell
# campaign. Writes to a throwaway output_root; not evidence. run.py ignores
# --runs/--dimension under --config, so this shrink lives in the config itself.
optimizers:
- dt-gsk
suite: cec2017
functions: default
dimensions:
- 50
- 100
runs: 2
seed: 20240620
seed_policy: unified
rand_generator: threefry
parallel: true
workers: 8
generation_logs: false
convergence_graphs: false
overwrite: true
output_root: results/_smoke_sgsm_cec2017
optimizer_options:
  interaction_graph_enabled: true
